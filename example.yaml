    cycle_count: { name: "Pack 1 Cycle Count" }
    insulation_resistance: { name: "Pack 1 Insulation Resistance" }
    bms_self_consumption: { name: "Pack 1 BMS Self-Consumption" }
    min_cell_voltage: { name: "Pack 1 Min Cell Voltage" }
    max_cell_voltage: { name: "Pack 1 Max Cell Voltage" }
    cell_voltage_delta: { name: "Pack 1 Cell Voltage Delta" }
    avg_cell_voltage: { name: "Pack 1 Avg Cell Voltage" }
    temperature_high: { name: "Pack 1 Temperature High" }
    temperature_low: { name: "Pack 1 Temperature Low" }
    cell_voltage_1:  { name: "Pack 1 Cell 1" }
    cell_voltage_2:  { name: "Pack 1 Cell 2" }
    cell_voltage_3:  { name: "Pack 1 Cell 3" }
    cell_voltage_4:  { name: "Pack 1 Cell 4" }
    cell_voltage_5:  { name: "Pack 1 Cell 5" }
    cell_voltage_6:  { name: "Pack 1 Cell 6" }
    cell_voltage_7:  { name: "Pack 1 Cell 7" }
    cell_voltage_8:  { name: "Pack 1 Cell 8" }
    cell_voltage_9:  { name: "Pack 1 Cell 9" }
    cell_voltage_10: { name: "Pack 1 Cell 10" }
    cell_voltage_11: { name: "Pack 1 Cell 11" }
    cell_voltage_12: { name: "Pack 1 Cell 12" }
    cell_voltage_13: { name: "Pack 1 Cell 13" }
    cell_voltage_14: { name: "Pack 1 Cell 14" }
    cell_voltage_15: { name: "Pack 1 Cell 15" }
    cell_voltage_16: { name: "Pack 1 Cell 16" }
    temperature_1: { name: "Pack 1 Temperature 1" }
    temperature_2: { name: "Pack 1 Temperature 2" }
    temperature_3: { name: "Pack 1 Temperature 3" }
