# Reference ESPHome configuration for esphome-tdt-bms.
#
# Hardware: any ESP32 / ESP32-S3 with a hardware UART wired to the BMS console
# port via an RS-232 level shifter. 9600 8N1.
#
# Provide your own secrets in a secrets.yaml alongside this file:
#   wifi_ssid: "..."
#   wifi_password: "..."
#   api_encryption_key: "..."
#   ota_password: "..."

substitutions:
  name: tdt-bms-monitor
  friendly_name: TDT BMS Monitor

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      # Required when the BMS UART lands on UART Bus 0 (i.e. it's the first
      # `uart:` entry). The IDF bootloader otherwise pre-configures UART0 for
      # console output, leaving IOMUX state that corrupts the first frame the
      # BMS sees and silences the chain. Both flags are needed on S3.
      CONFIG_ESP_CONSOLE_NONE: y
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://hinoserm/esphome-tdt-bms
    components: [tdt_bms]

uart:
  id: bms_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  rx_buffer_size: 384

tdt_bms:
  id: bms
  uart_id: bms_uart
  update_interval: 5s
  # packs: 2            # optional explicit override; otherwise auto-detected
  #                       from the pack numbers referenced by platform entries

# ── Pack 1 ────────────────────────────────────────────────────────────────
sensor:
  - platform: tdt_bms
    tdt_bms_id: bms
    pack: 1
    pack_voltage: { name: "Pack 1 Voltage" }
    pack_current: { name: "Pack 1 Current" }
    pack_power: { name: "Pack 1 Power" }
    cpu_voltage: { name: "Pack 1 CPU Voltage" }
    state_of_charge: { name: "Pack 1 SOC" }
    state_of_health: { name: "Pack 1 SOH" }
    remaining_capacity: { name: "Pack 1 Remaining Capacity" }
    full_capacity: { name: "Pack 1 Full Capacity" }
